<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>MEGAMANIA — Shmup Espacial 8-bit</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="cabinet">
  <div id="top-hud">
    <div class="hud-left">SCORE <span id="score">000000</span></div>
    <div class="hud-center">HI <span id="hi">000000</span></div>
    <div class="hud-right">VIDAS <span id="lives">4</span> &nbsp; FASE <span id="level">1</span> <button id="btn-pause" aria-label="Pausar" title="Pausar (P)">⏸</button></div>
  </div>

  <div id="screen-wrap">
    <canvas id="game" width="480" height="640"></canvas>
    <div id="overlay"></div>
    <div id="flash"></div>
  </div>

  <div id="bottom-hud">
    <div id="energy-label">ENERGIA <span id="energy-num">100</span></div>
    <div id="energy-bar"><div id="energy-fill"></div></div>
  </div>

  <div id="touch">
    <button id="btn-left" aria-label="Esquerda">◀</button>
    <button id="btn-pause-touch" aria-label="Pausar">⏸</button>
    <button id="btn-fire" aria-label="Fogo">FOGO</button>
    <button id="btn-right" aria-label="Direita">▶</button>
  </div>
  <div id="hint">← → / A D mover &nbsp;•&nbsp; ESPAÇO atirar &nbsp;•&nbsp; P / ESC pausa &nbsp;•&nbsp; M som</div>
</div>

<script src="js/sprites.js"></script>
<script src="js/audio.js"></script>
<script src="js/input.js"></script>
<script src="js/collisions.js"></script>
<script src="js/bullets.js"></script>
<script src="js/energy.js"></script>
<script src="js/levels.js"></script>
<script src="js/enemies.js"></script>
<script src="js/player.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
